# نشرُ دوالّ Firebase آليّاً عند الدمج إلى main.
#
# لماذا: لا شيء كان ينشر الدوالّ — لا Codemagic ولا Actions. فكلُّ إصلاحٍ خادميّ
# (الاسترداد التلقائي، تحقّقُ الدفع، أهليّةُ السائق) كان يُدمَج ويبقى **غير عامل**
# في الإنتاج حتى يفتح المالكُ طرفيّةً ويكتب `npm run deploy` بيده.
#
# الاعتماد: سرُّ المستودع `FIREBASE_SERVICE_ACCOUNT` — محتوى مفتاح حساب خدمةٍ
# بصيغة JSON. لا يُكتب في الشيفرة ولا في المحادثات؛ انظر
# `production_deployment_guide.md` للصلاحيات المطلوبة وخطوات إنشائه.
#
# **بلا `--force` عمداً:** مع `--non-interactive` وحدها يفشل النشر إن كانت دالّةٌ
# قد حُذفت من الشيفرة، بدل أن يحذفها من الإنتاج صامتاً. حذفُ دالّةٍ قرارٌ بشريّ
# يُنفَّذ يدويّاً مرّةً واحدة.
name: Deploy Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/functions_deploy.yml'
  workflow_dispatch:

# دمجتان متتاليتان لا تنشران معاً — الثانية تنتظر، ولا تُلغى الأولى في منتصفها.
concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to zyiarah-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      # لا يُنشَر ما لم يُختبَر: نفس فحوص CI، مكرّرةً هنا عمداً لأنّ هذا المسار
      # يكتب في الإنتاج وقد يُشغَّل يدويّاً (workflow_dispatch) على حالةٍ لم تمرّ بـPR.
      - name: Lint
        run: npm run lint
        working-directory: functions

      - name: Unit tests
        run: npm test
        working-directory: functions

      - name: Write service account key
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::سرُّ FIREBASE_SERVICE_ACCOUNT غير مضبوط في إعدادات المستودع"
            exit 1
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # `pipefail` لازمٌ: بلاهُ يَحجبُ `tee` خروجَ `firebase` فيَمرُّ فشلُ
      # النشرِ أخضرَ — وهو أسوأُ من الفشلِ نفسِه.
      - name: Deploy
        run: |
          set -o pipefail
          npx --yes firebase-tools@15 deploy --only functions \
            --project zyiarah-app --non-interactive 2>&1 \
            | tee "$RUNNER_TEMP/deploy.log"

      # ─────────────────────────────────────────────
      # فشلُ النشرِ كان **غيرَ قابلٍ للتشخيص** (2026-10-05)
      #
      # ثلاثُ دمجاتٍ متتاليةٍ فشلت عند خطوةِ `Deploy` بينما `lint` و`npm test`
      # وكتابةُ المفتاحِ كلُّها خضراء — فبقيت إصلاحاتُ ذلك اليومِ الخادميّةُ
      # **مدمَجةً وغيرَ عاملة**، وهي الحفرةُ التي وُجد هذا السيرُ لسدِّها،
      # مفتوحةً من جديدٍ بعلامةٍ حمراءَ بدلَ لا شيء.
      #
      # والسببُ لم يُعرَف، لأنّ **سجلَّ التشغيلِ لا يُقرأُ إلّا من الواجهة**:
      # تُخدَمُ السجلّاتُ من مُضيفٍ آخر، فـ`gh api .../logs` يَرفضُ التحويلَ،
      # و`check-runs` تُعيدُ `output` فارغاً. فلا يَبقى إلّا فتحُ الصفحةِ بيدٍ.
      #
      # فالخَرْجُ يُحفَظُ الآن ويُنشَرُ في **ملخَّصِ الوظيفةِ** وكـ**تنبيهاتٍ**
      # (`::error::`) — والتنبيهاتُ تُقرأُ عبر
      # `repos/{o}/{r}/check-runs/{id}/annotations`، فيَصيرُ الفشلُ التالي
      # مُشخَّصاً من الواجهةِ ومن الـAPI بلا فتحِ سجلّ.
      #
      # ولا سرَّ في الخَرْج: المفتاحُ يُكتَبُ في ملفٍّ ولا يُطبَعُ قطّ، و
      # `firebase` لا يَعرضُ إلّا معرّفَ المشروعِ وأسماءَ الدوالّ — وكلاهما
      # في هذا الملفِّ أصلاً.
      - name: Surface the failure
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/deploy.log"
          {
            echo "## ✗ فشلَ نشرُ الدوالّ"
            echo
            echo "آخرُ ستّينَ سطراً من خَرْجِ \`firebase deploy\`:"
            echo '```'
            tail -n 60 "$LOG" 2>/dev/null || echo "(لا سجلّ — فشلَ قبل النشر)"
            echo '```'
            echo
            echo "### ما يُفحَصُ بالترتيب"
            echo "1. **دالّةٌ جديدة؟** إنشاءُ دالّةٍ لأوّلِ مرّةٍ يَطلبُ أكثرَ"
            echo "   مِمّا يَطلبُه تحديثُ القائم: \`Cloud Build Editor\` و"
            echo "   \`Artifact Registry Administrator\` و\`Service Account User\`"
            echo "   على حسابِ تشغيلِ الدوالّ. القائمةُ الكاملةُ في"
            echo "   \`production_deployment_guide.md\` §1-ب."
            echo "2. **دالّةٌ مجدولةٌ أو طابورُ مهامّ؟** \`Cloud Scheduler Admin\`"
            echo "   و\`Cloud Tasks Admin\` — و\`Firebase Admin\` **لا يَشملُهما**"
            echo "   (هذا بعينُه عطلُ أوّلِ نشرٍ آليٍّ في 2026-10-04)."
            echo "3. **سرٌّ جديدٌ في \`defineSecret\`؟** يَلزمُه"
            echo "   \`Secret Manager Admin\` وأن يكونَ السرُّ موجوداً."
            echo "4. **دالّةٌ حُذفت من المصدر؟** لا \`--force\` هنا بقصد،"
            echo "   فالنشرُ يَفشلُ بدلَ أن يَحذفَ من الإنتاجِ صامتاً. الحذفُ"
            echo "   قرارٌ بشريٌّ يُنفَّذُ يدويّاً مرّةً واحدة."
            echo
            echo "### المَخرَجُ اليدويُّ ريثما يُصلَح"
            echo '```'
            echo "npm --prefix functions run deploy"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # تنبيهاتٌ تُقرأُ عبر الـAPI — أسطرُ الخطأِ وحدَها، لا السجلُّ كلُّه.
          grep -iE 'error|failed|denied|permission|403|400|HTTP Error' "$LOG" 2>/dev/null \
            | tail -n 15 | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
