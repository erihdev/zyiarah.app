name: iOS Release

# مسارٌ يدويٌّ مجّانيٌّ لإصدار iOS (المستودعُ عامٌّ فدقائقُ macOS بلا كلفة)، بديلاً
# عن Codemagic حين يتعذّر. لا يُلغي شهاداتِ التوزيعِ القائمة (كان يُلغيها كلَّها
# فيُعطّلُ شهادةَ Codemagic): يُنشئُ شهادةً مؤقّتةً بمفتاحٍ يُولَّدُ في الوظيفة،
# ويُلغي تلك الشهادةَ وحدَها عند الانتهاء.
on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Upload to App Store
    runs-on: macos-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      # نفسُ نقصِ `android_release.yml`: كان يَكتبُ مفتاحَ الخريطةِ وحدَه،
      # فبناءُ هذا السيرِ يُرفَعُ إلى App Store **بلا بطاقةٍ ولا Apple Pay**
      # (كلاهما مشروطٌ بـ`moyasarReady`). والسيرُ يدويُّ التشغيلِ فحسب، لكنّ
      # تشغيلَه يَرفعُ إلى المتجرِ فعلاً — فالسرُّ الغائبُ يُفشِلُ الوظيفة.
      - name: Create .env file
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          MOYASAR_PUBLISHABLE_KEY: ${{ secrets.MOYASAR_PUBLISHABLE_KEY }}
          SAMSUNG_PAY_SERVICE_ID: ${{ secrets.SAMSUNG_PAY_SERVICE_ID }}
        run: |
          # السرُّ الغائبُ لم يَعُدْ يُنتجُ بناءً بلا دفع: المفتاحُ القابلُ للنشرِ
          # مضمَّنٌ في `lib/utils/payment_keys.dart` منذ 2026-10-24 وقيمةُ `.env`
          # الفارغةُ تَسقطُ إليه. فالغيابُ يُعلَنُ تحذيراً ولا يُوقِفُ البناء.
          if [ -z "$MOYASAR_PUBLISHABLE_KEY" ]; then
            echo "::warning::سرُّ MOYASAR_PUBLISHABLE_KEY غير مضبوط — يُستعمَلُ المفتاحُ المضمَّنُ في الشفرة"
          fi
          if [ -z "$MAPBOX_TOKEN" ]; then
            echo "::error::سرُّ MAPBOX_TOKEN غير مضبوط — خريطةُ المناطق لن ترسم"
            exit 1
          fi
          {
            printf 'MAPBOX_TOKEN=%s\n' "$MAPBOX_TOKEN"
            printf 'MOYASAR_PUBLISHABLE_KEY=%s\n' "$MOYASAR_PUBLISHABLE_KEY"
            printf 'SAMSUNG_PAY_SERVICE_ID=%s\n' "$SAMSUNG_PAY_SERVICE_ID"
          } > .env

      - name: Install signing tools
        run: |
          python3 -m venv /tmp/cm && source /tmp/cm/bin/activate
          pip install -q codemagic-cli-tools PyJWT requests cryptography
          echo "/tmp/cm/bin" >> "$GITHUB_PATH"
          # فشلٌ مبكّرٌ إن تغيّرت أعلامُ النشر، قبل عشرين دقيقةَ بناء.
          app-store-connect publish --help > /tmp/publish_help.txt 2>&1 || true
          for f in --app-store --whats-new --cancel-previous-submissions --release-type --locale; do
            grep -q -- "$f" /tmp/publish_help.txt || { echo "::error::علَمُ النشر $f غير موجود في الأداة"; grep -E "^\s+--" /tmp/publish_help.txt | cut -c1-120; exit 1; }
          done

      - name: Normalise App Store Connect key
        env:
          RAW_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          for v in RAW_KEY KEY_ID ISSUER_ID; do
            [ -n "${!v}" ] || { echo "::error::سرُّ App Store Connect ($v) غير مضبوط في GitHub"; exit 1; }
          done
          umask 077
          printf '%b\n' "$RAW_KEY" > "$RUNNER_TEMP/asc_key.p8"
          openssl genrsa -out "$RUNNER_TEMP/cert_key.pem" 2048 2>/dev/null
          {
            echo "APP_STORE_CONNECT_KEY_IDENTIFIER=$KEY_ID"
            echo "APP_STORE_CONNECT_ISSUER_ID=$ISSUER_ID"
            echo "ASC_KEY_FILE=$RUNNER_TEMP/asc_key.p8"
            echo "CERT_KEY_FILE=$RUNNER_TEMP/cert_key.pem"
          } >> "$GITHUB_ENV"

      - name: Snapshot distribution certificates (before)
        run: python3 .github/scripts/asc_certs.py list > "$RUNNER_TEMP/certs_before.txt"

      - name: Fetch signing files (temporary certificate)
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat "$ASC_KEY_FILE")"
          app-store-connect fetch-signing-files com.zyiarah.zyiarah \
            --type IOS_APP_STORE \
            --certificate-key "@file:$CERT_KEY_FILE" \
            --create \
            --platform IOS
          python3 .github/scripts/asc_certs.py list > "$RUNNER_TEMP/certs_after.txt"
          comm -13 <(sort "$RUNNER_TEMP/certs_before.txt") <(sort "$RUNNER_TEMP/certs_after.txt") > "$RUNNER_TEMP/certs_new.txt"
          echo "شهاداتٌ مؤقّتةٌ أُنشئت: $(wc -l < "$RUNNER_TEMP/certs_new.txt" | tr -d ' ')"
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Build Flutter IPA
        run: |
          set -eo pipefail
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat "$ASC_KEY_FILE")"
          flutter config --no-enable-swift-package-manager
          flutter pub get
          if ! OUT=$(app-store-connect get-latest-testflight-build-number 6760955777); then
            echo "::error::تعذّرت قراءةُ آخرِ رقمِ بناءٍ من TestFlight"; exit 1
          fi
          LATEST=$(printf '%s\n' "$OUT" | tail -n1 | tr -d '[:space:]')
          case "$LATEST" in ''|*[!0-9]*) echo "::error::رقمُ بناءٍ غيرُ مقروء: '$LATEST'"; exit 1;; esac
          NEW_BUILD=$((LATEST + 1))
          echo "رقمُ البناء: $NEW_BUILD (آخرُ منشور: $LATEST)"
          flutter build ipa --release \
            --build-number="$NEW_BUILD" \
            --export-options-plist="$HOME/export_options.plist" 2>&1 | tee /tmp/build.log | tail -n 400
          ls -la build/ios/ipa/

      - name: Upload dSYMs to Firebase Crashlytics
        continue-on-error: true
        run: |
          find build/ios/ipa build/ios/archive -name "*.dSYM.zip" -o -name "*.dSYM" 2>/dev/null | head -n 20 | while read -r f; do
            ios/Pods/FirebaseCrashlytics/upload-symbols -gsp ios/Runner/GoogleService-Info.plist -p ios "$f" || true
          done

      - name: Upload to TestFlight and submit for App Store review
        run: |
          set -eo pipefail
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat "$ASC_KEY_FILE")"
          test -s .github/whatsnew/whatsnew-ar
          app-store-connect publish \
            --path build/ios/ipa/*.ipa \
            --app-store \
            --cancel-previous-submissions \
            --release-type AFTER_APPROVAL \
            --locale ar-SA \
            --whats-new "$(cat .github/whatsnew/whatsnew-ar)"

      - name: Revoke the temporary certificate
        if: always()
        run: |
          [ -s "$RUNNER_TEMP/certs_new.txt" ] || { echo "لا شهادةَ مؤقّتةً تُلغى"; exit 0; }
          python3 .github/scripts/asc_certs.py revoke $(cat "$RUNNER_TEMP/certs_new.txt")

      - name: Remove key material
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_key.p8" "$RUNNER_TEMP/cert_key.pem"
