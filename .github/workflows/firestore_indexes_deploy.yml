# نشرُ فهارس Firestore عند الدمج.
#
# فهرسٌ في الملفّ ولا أحد ينشره = لا شيء — نفسُ ثقبِ الدوالّ واللوحة. وبناءُ
# الفهرس عند Google يستغرق دقائق إلى ساعات على مجموعةٍ كبيرة؛ الاستعلامُ يبقى
# فاشلاً حتى يكتمل (Firebase Console ← Firestore ← Indexes يُظهر Building).
#
# **الفهارسُ وحدها — لا القواعد، عمداً.** `firestore.rules` يحمل تحذيراً صريحاً
# (STAGE-C: «DO NOT DEPLOY UNTIL THE NEW APP IS THE MINIMUM VERSION») لأنّ
# قاعدةَ إنشاء الطلب الجديدة تكسر مدفوعاتِ النسخ القديمة من التطبيق. فنشرُ
# القواعد قرارٌ بشريٌّ مرتبطٌ بانتشار الإصدار، لا أثرٌ جانبيٌّ لدمجة.
name: Deploy Firestore Indexes

on:
  push:
    branches: [main]
    paths:
      - 'firestore.indexes.json'
      - '.github/workflows/firestore_indexes_deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-firestore-indexes
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy indexes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # ملفٌّ غيرُ صالحٍ نحويّاً يفشل عند firebase بعد تثبيتٍ كامل — نكشفه فوراً.
      - name: Validate JSON
        run: node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8'))"

      - name: Write service account key
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::سرُّ FIREBASE_SERVICE_ACCOUNT غير مضبوط في إعدادات المستودع"
            exit 1
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # `pipefail` حاملٌ لا زينة: بلاهُ يَحجبُ `tee` خروجَ `firebase`
      # فيَمرُّ فشلُ النشرِ أخضرَ — أسوأُ من الفشلِ نفسِه.
      - name: Deploy
        run: |
          set -o pipefail
          npx --yes firebase-tools@15 deploy --only firestore:indexes \
            --project zyiarah-app --non-interactive 2>&1 \
            | tee "$RUNNER_TEMP/deploy.log"

      # فشلُ النشرِ كان يَترُكُ **علامةً حمراءَ وحدَها**: سجلُّ التشغيلِ
      # يُخدَمُ من مُضيفٍ آخرَ ولا يُقرأُ من الـAPI، و`check-runs` تُعيدُ
      # `output` فارغاً — فلا يُشخَّصُ إلّا بفتحِ الصفحةِ بيد. فالخَرْجُ
      # يُنشَرُ الآن في ملخَّصِ الوظيفةِ وكتنبيهاتٍ تُقرأُ عبر
      # `check-runs/{id}/annotations`. (2026-10-05، بعد ثلاثِ دمجاتٍ
      # فشلَ نشرُ دوالِّها بلا سببٍ مقروء.)
      # **انحرافُ الملفِّ عن الإنتاجِ كان سطراً واحداً في سجلٍّ لا يُقرَأ.**
      # بـ`--non-interactive` وبلا `--force` تَطبعُ الأداةُ «there are N
      # indexes defined in your project that are not present in your
      # firestore indexes file» ثمّ **تُكمِلُ النشرَ بنجاح** — مُتحقَّقٌ من
      # مصدرِها (`lib/firestore/api.js`: الفرعُ يُسجّلُ ثمّ
      # `confirm({nonInteractive, force, default: false})`، و`lib/prompt.js`
      # يُعيدُ الافتراضَ المُعلَنَ ولا يَرمي). فالانحرافُ لا يُفشِلُ شيئاً
      # ولا يُرى: يُنشَرُ في ملخَّصِ الوظيفةِ الآن ليُقرَأَ بلا فتحِ سجلّ.
      - name: Report file ↔ project divergence
        if: success()
        run: |
          LOG="$RUNNER_TEMP/deploy.log"
          N=$(grep -oE '[0-9]+ indexes defined in your project' "$LOG" 2>/dev/null \
            | grep -oE '^[0-9]+' | head -1 || true)
          F=$(grep -oE '[0-9]+ field overrides defined in your project' "$LOG" 2>/dev/null \
            | grep -oE '^[0-9]+' | head -1 || true)
          {
            echo "## ✓ نُشرت الفهارس"
            if [ -n "$N" ] || [ -n "$F" ]; then
              echo
              echo "### الملفُّ لا يَصفُ الإنتاجَ كاملاً"
              [ -n "$N" ] && echo "- **$N فهرساً** في المشروعِ وليست في \`firestore.indexes.json\`."
              [ -n "$F" ] && echo "- **$F تجاوزَ حقلٍ** في المشروعِ وليست في الملفّ."
              echo
              echo "حذفُها **لا يَجري من هنا**: مسارُ النشرِ بلا \`--force\` بقرارٍ"
              echo "مُثبَّتٍ في \`test/functions_deploy_guard_test.dart\`. والحذفُ"
              echo "بيدٍ واحدةً، ويَحذفُ في الوقتِ نفسِه **كلَّ تجاوزِ حقلٍ**"
              echo "قائمٍ في الإنتاجِ وغائبٍ عن الملفّ — والملفُّ يُعلِنُ"
              echo "\`fieldOverrides: []\`، فتحقّقْ من الكونسولِ أوّلاً:"
              echo '```'
              echo "npx firebase-tools@15 deploy --only firestore:indexes \\"
              echo "  --project zyiarah-app --force"
              echo '```'
            else
              echo
              echo "الملفُّ يَصفُ الإنتاجَ: لا فهرسَ ولا تجاوزَ حقلٍ زائدٌ هناك."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Surface the failure
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/deploy.log"
          {
            echo "## ✗ فشلَ النشر"
            echo
            echo '```'
            tail -n 60 "$LOG" 2>/dev/null || echo "(لا سجلّ — فشلَ قبل النشر)"
            echo '```'
            echo
            echo "### ما يُفحَص"
            echo "1. **صلاحيّات**: \`Cloud Datastore Index Admin\` أو \`Firebase Admin\`."
            echo "2. **صياغة** \`firestore.indexes.json\`: حقلٌ مكرَّرٌ أو ترتيبٌ غيرُ صالح."
            echo "3. فهرسٌ قائمٌ بالحقولِ نفسِها بترتيبٍ آخرَ يُرفَض."
            echo "   ولا تُنشَرُ القواعدُ من هنا بحالٍ (حجزُ STAGE-C)."
            echo
            echo "### المَخرَجُ اليدويّ"
            echo '```'
            echo "npx firebase-tools@15 deploy --only firestore:indexes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -iE 'error|failed|denied|permission|403|400|HTTP Error' "$LOG" 2>/dev/null \
            | tail -n 15 | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
