name: zyiarah
description: "A new Flutter project."
publish_to: "none"

version: 1.2.47+246

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  latlong2: ^0.9.1
  google_fonts: ^8.1.0
  firebase_core: ^4.9.0
  # شجرة FlutterFire كلها على firebase_core_platform_interface 8.x. الدرس
  # (2026-09-13، البناء ٣١ — أوّل بناء تلقائي): إضافات crashlytics 5.2.5
  # وmessaging 16.4.2 وanalytics 12.4.4 وfunctions 6.3.4 وstorage 13.4.4 تستعمل
  # FirebasePlugin (مُعرَّف في 8.0.0) وتعلن ^7.1.0 — قيدٌ رخو يمرّ به الحلّ ثم
  # يفشل التصريف بـ «Type 'FirebasePlugin' not found». تثبيتُ cloud_firestore
  # عند 6.4.0 كان يحبس الواجهة عند 7.1.0 فيجرّ الشجرة كلها إلى الفخّ، وحدُّ
  # firebase_auth <6.5.5 السابق عالج عَرَضاً واحداً وترك خمسة.
  # لا تُثبّت حزمة Firebase واحدة بمعزل عن أخواتها؛ ارفعها معاً.
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  flutter_map: ^8.3.2
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^18.0.1
  firebase_storage: ^13.4.1
  pdf: ^3.12.0
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.1
  webview_flutter: ^4.10.1
  qr_flutter: ^4.1.0
  http: ^1.3.0
  flutter_dotenv: ^6.0.1
  intl: ^0.20.2
  pay: ^3.3.0
  signature: ^6.3.0
  shimmer: ^4.0.0
  lottie: ^3.3.3
  firebase_crashlytics: ^5.2.2
  firebase_analytics: ^12.4.1
  cloud_functions: ^6.3.2
  image_picker: ^1.2.2
  table_calendar: ^3.0.9
  printing: ^5.14.3
  app_links: ^7.0.0
  fl_chart: ^1.2.0
  cached_network_image: ^4.0.0
  go_router: ^17.2.3
  provider: ^6.1.5+1
  arabic_reshaper: ^0.0.1
  bidi: ^2.0.13
  crypto: ^3.0.3
  moyasar: ^3.0.3
  tabby_flutter_inapp_sdk: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo.png
    - assets/apple_pay_config.json
    - assets/google_pay_config.json
    - assets/images/hourly_cleaning.png
    - assets/images/monthly_cleaning.png
    - assets/images/sofa_cleaning.png
    - assets/images/company_cleaning.png
    - assets/images/car_cleaning.png
    - assets/images/store.png
    - assets/images/event_workers.png
    - assets/payment/
    # خطوط Tajawal — مضمّنة محلياً لواجهة التطبيق كلها + الـ PDF. تنزيلها من
    # الشبكة (google_fonts/PdfGoogleFonts) كان يعلّق توليد الفواتير ويُظهر خطاً
    # بديلاً في أول تشغيل بلا إنترنت. يجب أن تبقى في assets (لا fonts فقط) لأن
    # google_fonts يبحث عن Tajawal-<Variant>.ttf في AssetManifest قبل أي جلب شبكي.
    # الأوزان الأربعة تغطي كل الاستخدامات: 400 (وأي normal)، 500 (يلتقط w500/w600)،
    # 700 (bold)، 900 (w900) — نقص أي وزن مستخدَم = استثناء لأن الجلب الشبكي مُعطَّل.
    - assets/fonts/Tajawal-Regular.ttf
    - assets/fonts/Tajawal-Medium.ttf
    - assets/fonts/Tajawal-Bold.ttf
    - assets/fonts/Tajawal-Black.ttf
    # رخصة OFL للخط — تُسجَّل في LicenseRegistry (شرط الترخيص عند تضمين الخط).
    - assets/fonts/OFL.txt
  # التصريح كعائلة خطوط نظامية باسم 'Tajawal' — يطابق fontFamilyFallback الذي
  # يضبطه GoogleFonts.tajawal، فأي وزن غير مضمّن يسقط على أقرب وزن هنا بدل خط النظام.
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"

# شاشة الإطلاق الأصلية (native) — تعرض شعار زيارة فوراً على أبيض بدل الشاشة البيضاء
# الفارغة. الخلفية بيضاء مطابقة لـ ZyiarahSplashScreen فينتقل بسلاسة للمتحرّك.
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/logo.png
  android: true
  ios: true
  web: false
