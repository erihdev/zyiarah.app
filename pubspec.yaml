name: zyiarah
description: "A new Flutter project."
publish_to: "none"

version: 1.2.36+242

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  latlong2: ^0.9.1
  google_fonts: ^8.1.0
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: 6.4.0
  flutter_map: ^7.0.2
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^18.0.1
  firebase_storage: ^13.4.1
  pdf: ^3.12.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.0.0
  webview_flutter: ^4.10.1
  qr_flutter: ^4.1.0
  http: ^1.3.0
  flutter_dotenv: ^6.0.1
  intl: ^0.20.2
  pay: ^3.3.0
  signature: ^6.3.0
  shimmer: ^3.0.0
  lottie: ^3.3.3
  firebase_crashlytics: ^5.2.2
  firebase_analytics: ^12.4.1
  cloud_functions: ^6.3.2
  image_picker: ^1.2.2
  table_calendar: ^3.0.9
  printing: ^5.14.3
  app_links: ^7.0.0
  fl_chart: ^1.2.0
  cached_network_image: ^3.4.1
  go_router: ^17.2.3
  provider: ^6.1.5+1
  arabic_reshaper: ^0.0.1
  bidi: ^2.0.13
  crypto: ^3.0.3
  moyasar: ^3.0.3
  tabby_flutter_inapp_sdk: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo.png
    - assets/apple_pay_config.json
    - assets/google_pay_config.json
    - assets/images/hourly_cleaning.png
    - assets/images/monthly_cleaning.png
    - assets/images/sofa_cleaning.png
    - assets/images/company_cleaning.png
    - assets/images/store.png
    - assets/payment/
    # خطوط الـ PDF — مضمّنة محلياً. تنزيلها من الشبكة (PdfGoogleFonts) كان يعلّق
    # توليد الفواتير والعقود إلى الأبد عند ضعف الاتصال.
    - assets/fonts/Tajawal-Regular.ttf
    - assets/fonts/Tajawal-Bold.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"

# شاشة الإطلاق الأصلية (native) — تعرض شعار زيارة فوراً على أبيض بدل الشاشة البيضاء
# الفارغة. الخلفية بيضاء مطابقة لـ ZyiarahSplashScreen فينتقل بسلاسة للمتحرّك.
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/logo.png
  android: true
  ios: true
  web: false
