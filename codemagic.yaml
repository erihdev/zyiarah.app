workflows:
  ios-release:
    name: Zyiarah iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m1
    # triggering أدناه تطلب بناءً ورفعاً إلى TestFlight عند كل دفعة إلى main.
    # الطلب يصل عبر webhook من GitHub أُنشئ في 2026-09-13 (ping مقبول 202) —
    # قبله لم يصل حدث واحد رغم أن الكتلة موجودة منذ 2026-07-25 (54fa155)، فكان
    # كل بناء يدوياً. راجع «الـwebhook» في production_deployment_guide.md.
    # النشر للجمهور يبقى يدوياً.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    integrations:
      app_store_connect: Zyiarah Key  # يجب أن يتطابق اسم الـ integration في Codemagic Dashboard
    environment:
      # مثبَّتة عمداً لا stable: ترقية stable الخارجية رفعت حدّي Gradle وAGP
      # فكسرت البناء بلا أي تغيير منّا — وهذا يقع في أسوأ وقت (مهلة Play).
      # ترقيتها قرار صريح نختبره، لا مفاجأة تصل مع أول دفعة.
      flutter: 3.47.0
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials         # APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_ID,
                                        # APP_STORE_CONNECT_PRIVATE_KEY, MAPBOX_TOKEN
        - payment_keys                 # MOYASAR_PUBLISHABLE_KEY, MOYASAR_SECRET_KEY,
                                        # TABBY_PUBLIC_KEY, SAMSUNG_PAY_SERVICE_ID
      vars:
        BUNDLE_ID: "com.zyiarah.zyiarah"
        APP_STORE_APP_ID: "6760955777"

    scripts:
      # ─────────────────────────────────────────────
      # 1. إعداد ملف .env (Mapbox token)
      # ─────────────────────────────────────────────
      - name: Create .env file
        script: |
          echo "MAPBOX_TOKEN=$MAPBOX_TOKEN"                         > .env
          echo "MOYASAR_PUBLISHABLE_KEY=$MOYASAR_PUBLISHABLE_KEY"  >> .env
          echo "TABBY_PUBLIC_KEY=$TABBY_PUBLIC_KEY"                >> .env
          echo "SAMSUNG_PAY_SERVICE_ID=$SAMSUNG_PAY_SERVICE_ID"    >> .env
          echo "✓ .env created"

      # ─────────────────────────────────────────────
      # 2. إلغاء أي submission مفتوح في App Store
      #    (ignore_failure لأن هذا ليس خطوة حرجة)
      # ─────────────────────────────────────────────
      - name: Cancel existing App Store review submissions
        ignore_failure: true
        script: |
          python3 << 'PYEOF'
          import jwt, time, requests, os, re

          ISSUER_ID = os.environ.get("APP_STORE_CONNECT_ISSUER_ID", "").strip()
          KEY_ID    = os.environ.get("APP_STORE_CONNECT_KEY_ID", "").strip()
          APP_ID    = os.environ.get("APP_STORE_APP_ID", "6760955777").strip()
          BASE_URL  = "https://api.appstoreconnect.apple.com/v1"

          if not ISSUER_ID or not KEY_ID:
              print("WARNING: ISSUER_ID or KEY_ID not set — skipping cancellation")
              exit(0)

          # قراءة المفتاح الخاص بصورة صحيحة سواء كان مخزناً كـ @file: أو كـ نص مباشر
          raw_key = os.environ.get("APP_STORE_CONNECT_PRIVATE_KEY", "").strip()
          if raw_key.startswith("@file:"):
              file_path = raw_key[len("@file:"):].strip()
              with open(file_path, "r") as f:
                  raw_key = f.read().strip()
          elif os.path.exists(raw_key):
              with open(raw_key, "r") as f:
                  raw_key = f.read().strip()

          raw_key = raw_key.replace("\\n", "\n")
          m = re.search(r"-----BEGIN[^-]*-----(.+?)-----END[^-]*-----", raw_key, re.DOTALL)
          body = m.group(1) if m else raw_key
          body = re.sub(r"\s+", "", body)
          body = "\n".join(body[i:i+64] for i in range(0, len(body), 64))
          private_key = f"-----BEGIN PRIVATE KEY-----\n{body}\n-----END PRIVATE KEY-----\n"

          def make_token():
              payload = {"iss": ISSUER_ID, "exp": int(time.time()) + 1200, "aud": "appstoreconnect-v1"}
              return jwt.encode(payload, private_key, algorithm="ES256", headers={"kid": KEY_ID})

          def hdrs():
              return {"Authorization": f"Bearer {make_token()}", "Content-Type": "application/json"}

          try:
              r = requests.get(f"{BASE_URL}/apps/{APP_ID}/reviewSubmissions",
                               headers=hdrs(), params={"limit": 20}, timeout=30)
              submissions = r.json().get("data", [])
              print(f"Found {len(submissions)} existing review submission(s)")
              open_states = {"WAITING_FOR_REVIEW", "IN_REVIEW", "READY_FOR_REVIEW", "UNRESOLVED_ISSUES"}
              for s in submissions:
                  sid   = s["id"]
                  state = s.get("attributes", {}).get("state", "")
                  print(f"  Submission {sid}: state={state}")
                  if state in open_states:
                      r2 = requests.post(
                          f"{BASE_URL}/reviewSubmissions/{sid}/actions/cancel",
                          headers=hdrs(), json={}, timeout=30
                      )
                      print(f"    cancel => HTTP {r2.status_code}")
                      time.sleep(3)
              if submissions:
                  print("Waiting 10s for Apple to process...")
                  time.sleep(10)
          except Exception as e:
              print(f"WARNING: submission cancellation failed: {e}")
          PYEOF

      # ─────────────────────────────────────────────
      # 3. تثبيت تبعيات Flutter و CocoaPods
      # ─────────────────────────────────────────────
      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Install CocoaPods
        script: cd ios && pod install

      # ─────────────────────────────────────────────
      # 4. إعداد Keychain وكتابة مفتاح الشهادة الثابت
      #
      #    السبب الجذري للفشل السابق:
      #    كان يُولَّد مفتاح RSA جديد في كل build →
      #    Apple لا تجد شهادة مطابقة له → تحاول
      #    إنشاء شهادة جديدة → ترفض لأن الـ slots
      #    الـ 2 المسموح بها ممتلئة → 409 Error.
      #
      #    الحل الدائم:
      #    ✅ CERTIFICATE_PRIVATE_KEY مخزَّن في
      #       Codemagic → appstore_credentials group.
      #    ✅ يُكتب مرة واحدة لملف مؤقت في كل build.
      #    ✅ Apple تجد الشهادة المطابقة وتُعيد
      #       استخدامها بدلاً من إنشاء جديدة.
      # ─────────────────────────────────────────────
      - name: Initialize keychain
        script: keychain initialize

      - name: Write certificate private key
        script: |
          # CERTIFICATE_PRIVATE_KEY مخزَّن في appstore_credentials group في Codemagic
          # (أضفه من Dashboard → Environment variables → appstore_credentials)
          echo "$CERTIFICATE_PRIVATE_KEY" > /tmp/private.key
          chmod 600 /tmp/private.key
          echo "✓ Certificate private key written to /tmp/private.key"

      # ─────────────────────────────────────────────
      # 5. جلب ملفات التوقيع (certificate + profile)
      #
      #    مع المفتاح الثابت:
      #    • إذا وُجدت شهادة مطابقة → تُعاد استخدامها ✅
      #    • إذا لم توجد + --create → تُنشأ شهادة جديدة ✅
      #    • لا يحدث 409 لأنه لا يُنشئ شهادة جديدة
      #      في كل مرة.
      #
      #    ملاحظة Push Notifications:
      #    ✅ تأكد أن App ID يملك "Push Notifications"
      #       مُفعَّلاً في Apple Developer Portal →
      #       Identifiers → com.zyiarah.zyiarah
      # ─────────────────────────────────────────────
      - name: Fetch signing files (App Store distribution)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/private.key \
            --create \
            --platform IOS

      # ─────────────────────────────────────────────
      # 6. إضافة الشهادات للـ Keychain وضبط Xcode
      # ─────────────────────────────────────────────
      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Set up Xcode code signing
        # هذا الأمر يُنشئ export_options.plist في $HOME
        # ويُحدِّث إعدادات التوقيع في Xcode project تلقائياً
        script: xcode-project use-profiles

      # ─────────────────────────────────────────────
      # 7. بناء IPA
      #    ─ ROOT CAUSE FIX #3 ─
      #    الملف القديم لم يُمرِّر --export-options-plist
      #    مما يجعل Flutter يستخدم إعدادات automatic
      #    signing الخاصة به، وقد يتعارض مع الـ
      #    provisioning profile المُحمَّل يدوياً
      #    (خاصةً مع entitlements مثل Push Notifications).
      #    الحل: تمرير الملف الذي أنشأه use-profiles.
      # ─────────────────────────────────────────────
      - name: Build Flutter IPA
        script: |
          set -e
          # Disable SPM to avoid cloud_firestore FLTPipelineParser.m bug
          flutter config --no-enable-swift-package-manager
          # رقم بناء تلقائي = آخر رقم منشور (+1) — يمنع خطأ "الرقم مستخدم مسبقاً"
          # ويُغني عن تعديل pubspec يدوياً كل إصدار.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then
            LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo "208")
          fi
          NEW_BUILD=$((LATEST + 1))
          echo "Auto build number: $NEW_BUILD (latest published: $LATEST)"
          flutter build ipa --release \
            --build-number=$NEW_BUILD \
            --export-options-plist=$HOME/export_options.plist
          echo "✓ IPA built successfully (build $NEW_BUILD)"

      # ─────────────────────────────────────────────
      # 8. رفع رموز dSYMs تلقائياً إلى Firebase Crashlytics
      # ─────────────────────────────────────────────
      - name: Upload dSYMs to Firebase Crashlytics
        script: |
          echo "Uploading dSYMs to Firebase Crashlytics..."
          # البحث عن ملف الـ dSYM.zip في مجلد البناء ورفعه تلقائياً
          find build/ios/ipa -name "*.dSYM.zip" -exec ios/Pods/FirebaseCrashlytics/upload-symbols -gsp ios/Runner/GoogleService-Info.plist -p ios {} \;
          echo "✓ dSYMs upload process executed"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/*.dSYM.zip          # رموز تصحيح الأخطاء المرفوعة لـ Firebase Crashlytics
      - $HOME/Library/Logs/gym/*.log      # سجلات Xcode عند الفشل
      - /tmp/xcodebuild_logs/*.log
      - $HOME/export_options.plist        # للتحقق من إعدادات التوقيع

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false        # غيِّر إلى true للنشر المباشر على App Store

  # ═══════════════════════════════════════════════════
  # Android Workflow — بدون تغيير
  # ═══════════════════════════════════════════════════
  android-release:
    name: Zyiarah Android Release
    max_build_duration: 120
    instance_type: linux_x2
    # triggering أدناه تطلب بناء AAB موقّع ورفعه إلى مسار «الاختبار الداخلي»
    # عند كل دفعة إلى main — نظير ios-release. كانت المهمّة بلا triggering
    # إطلاقاً (آخر وسم v1.2.2 بينما الإصدار 1.2.47).
    #
    # مجموعة google_play مُنشأة وتعمل: البناء رقم ٣٠ (4f33ce9، ٣١ أغسطس ٢٠٢٦)
    # أنهى خطوة Publishing في ١م٨ث بحالة finished، وقبله رفع بناءٌ آخر
    # versionCode=191 فعلياً إلى Play (انظر الحارس في سكربت البناء أدناه).
    #
    # triggering وحدها لا تكفي — لا هنا ولا في ios-release: الحدث يجب أن يصل
    # من GitHub عبر webhook. أُنشئ في 2026-09-13 (ping مقبول 202)؛ قبله لم يصل
    # حدث واحد قطّ (Recent deliveries: No deliveries yet)، والبناء ٣٠ يقول
    # Started by: erihdev@gmail.com. تعليقٌ سابق هنا قال «ما كان ناقصاً هو
    # triggering وحده» — كان ناقصاً بدوره.
    # النشر للجمهور (track: production) يبقى قراراً يدوياً كما هو في iOS.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    environment:
      # مثبَّتة عمداً لا stable: ترقية stable الخارجية رفعت حدّي Gradle وAGP
      # فكسرت البناء بلا أي تغيير منّا — وهذا يقع في أسوأ وقت (مهلة Play).
      # ترقيتها قرار صريح نختبره، لا مفاجأة تصل مع أول دفعة.
      flutter: 3.47.0
      groups:
        - android_credentials  # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD,
                                # ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_BASE64, MAPBOX_TOKEN
        - payment_keys         # MOYASAR_PUBLISHABLE_KEY, MOYASAR_SECRET_KEY,
                                # TABBY_PUBLIC_KEY, SAMSUNG_PAY_SERVICE_ID
        - google_play          # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (محتوى JSON لحساب
                                # خدمة Google Play — مؤمَّن). مُنشأة ومُتحقَّق منها: يعتمد
                                # عليها get-latest-build-number ورفعُ AAB معاً.
      vars:
        PACKAGE_NAME: "com.zyiarah.zyiarah"
    scripts:
      - name: Create .env file
        script: |
          echo "MAPBOX_TOKEN=$MAPBOX_TOKEN"                         > .env
          echo "MOYASAR_PUBLISHABLE_KEY=$MOYASAR_PUBLISHABLE_KEY"  >> .env
          echo "TABBY_PUBLIC_KEY=$TABBY_PUBLIC_KEY"                >> .env
          echo "SAMSUNG_PAY_SERVICE_ID=$SAMSUNG_PAY_SERVICE_ID"    >> .env

      - name: Set up key.properties
        script: |
          echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD"        >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS"              >> android/key.properties
          echo "storeFile=upload-keystore.jks"            >> android/key.properties

      - name: Set up keystore file
        script: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Build Android App Bundle (AAB)
        script: |
          set -e
          # versionCode تلقائي = آخر رقم منشور على Google Play (+1) — يمنع رفض
          # «versionCode مستخدم مسبقاً» ويُغني عن تعديل pubspec يدوياً كل إصدار
          # (نظير منطق iOS). يحتاج GCLOUD_SERVICE_ACCOUNT_CREDENTIALS.
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then LATEST=246; fi
          NEW_CODE=$((LATEST + 1))
          # حارس لمرّة واحدة: بناء سابق رفع versionCode=191 إلى Google Play قبل أن يفشل
          # النشر (إقرار موقع الخلفية)، وقد لا يعيده get-latest — فلا نعيد استخدام ≤191
          # تفادياً لرفض «versionCode مستخدم مسبقاً». يصبح خاملاً تلقائياً بعد تجاوز 191.
          if [ "$NEW_CODE" -le 191 ]; then NEW_CODE=192; fi
          echo "Auto versionCode: $NEW_CODE (latest on Play: $LATEST)"
          flutter build appbundle --release --build-number=$NEW_CODE
          echo "✓ AAB built successfully (versionCode $NEW_CODE)"

    artifacts:
      - build/app/outputs/bundle/release/*.aab

    publishing:
      # نشر تلقائي إلى مسار «الاختبار الداخلي» (نظير TestFlight لـ iOS) — يظهر لمختبريك
      # فوراً بلا مراجعة. للنشر المباشر للجمهور غيّر track إلى production (مراجعة ~7 أيام).
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false
