  <template id="fallback-policy"># سياسة الخصوصية - تطبيق زيارة (Zyiarah)

تعتبر خصوصية بياناتكم أولوية قصوى لمؤسسة معاذ يحي محمد المالكي ("المؤسسة"). توضح هذه السياسة المعلومات التي نجمعها عند استخدام تطبيق "زيارة"، ولماذا نجمعها، ومع من نشاركها، وكيف تحذفونها.

## 1. المعلومات التي يتم جمعها
- **بيانات الحساب:** الاسم، والبريد الإلكتروني وكلمة المرور (لإنشاء الحساب وتسجيل الدخول)، ورقم الجوال (للتواصل بشأن الطلب وإتمام الدفع بالتقسيط). يتم تسجيل الدخول بالبريد الإلكتروني وكلمة المرور.
- **بيانات الموقع (GPS):** نطلب موقعك الدقيق لتحديد عنوان تنفيذ الخدمة ومنطقة التغطية والسعر. ويُستخدم موقع مقدّم الخدمة (السائق) أثناء تنفيذ مهمة نشطة فقط لعرض وصوله إليكِ.
- **بيانات الطلبات والمدفوعات:** سجل الطلبات والمبالغ والفواتير ورصيد المحفظة ونقاط الولاء. أما بيانات البطاقة البنكية فتُدخَل داخل التطبيق وتُرسَل مباشرة إلى بوابة الدفع (ميسر)، ولا نحفظ رقم البطاقة لدينا.
- **الصور:** عند تقييم الخدمة يمكنكِ إرفاق صورة اختيارياً من الكاميرا، وتُستخدم لمراجعة جودة الخدمة فقط.
- **العقود والتقييم والدعم:** التوقيع الإلكتروني بخط اليد عند توثيق عقد الباقة، وتعليقك عند تقييم الخدمة، ومحتوى تذاكر الدعم التي ترسلينها.
- **بيانات الجهاز والاستخدام:** معرّف الجهاز اللازم لإرسال الإشعارات، وتقارير الأعطال التقنية، وإحصاءات استخدام عامة غير مرتبطة بهويتك (مثل الشاشات المستخدمة والمنطقة التقريبية) لتحسين استقرار التطبيق.

## 2. استخدام المعلومات
- تنفيذ طلبات خدمات النظافة والصيانة والضيافة، وإسناد مقدّم الخدمة المناسب، وإرسال إشعارات الطلب والتذكير بالموعد.
- معالجة عمليات الدفع والتقسيط والاسترداد.
- إصدار الفواتير الضريبية الإلكترونية المتوافقة مع متطلبات هيئة الزكاة والضريبة والجمارك (ZATCA).
- خدمة العملاء والرد على تذاكر الدعم.
- إصلاح الأعطال وتحسين أداء التطبيق.

لا نستخدم بياناتكم للإعلانات الموجّهة، ولا نتتبّعكم عبر تطبيقات أو مواقع أخرى.

## 3. مشاركة البيانات مع أطراف ثالثة
نحن لا نبيع بياناتكم الشخصية. يتم مشاركة المعلومات الضرورية فقط مع:
- **بوابات الدفع:** ميسر (لمعالجة البطاقات وApple Pay وGoogle Pay وSamsung Pay وSTC Pay)، وتمارا عند اختيار التقسيط (الاسم ورقم الجوال والبريد الإلكتروني ومبلغ الطلب).
- **مزوّدي الخدمات التقنية:** خدمات Google Firebase (استضافة البيانات والمصادقة والإشعارات وتقارير الأعطال)، وMapbox (الخرائط والبحث عن العنوان)، ومزوّد البريد الإلكتروني لإرسال رسائل الطلب.
- **مقدّم الخدمة (السائق):** الاسم ورقم الجوال وعنوان التنفيذ اللازمة لتنفيذ طلبك فقط.
- **الجهات الحكومية:** في حالات الامتثال الضريبي (ZATCA) أو المتطلبات القانونية.

## 4. حماية البيانات وحقوق المستخدم
- تُنقل جميع البيانات بين التطبيق والخوادم مشفّرة.
- للمستخدم الحق في الوصول إلى بياناته وتعديلها من قسم "حسابي" داخل التطبيق.
- **حذف الحساب:** يمكن طلب حذف الحساب نهائياً من قسم "حسابي" داخل التطبيق، أو بمراسلتنا على البريد أدناه. عند الحذف يُحذف حساب الدخول وبيانات الملف الشخصي ومعرّفات الإشعارات.
- **ما يُحتفظ به بعد الحذف:** سجلات الطلبات والفواتير الضريبية تُحفظ للمدة التي يفرضها نظام ضريبة القيمة المضافة، ويُسجَّل أي رصيد متبقٍ في المحفظة لدى المؤسسة.

## 5. التواصل
لأي استفسار بخصوص الخصوصية أو لطلب حذف البيانات، يرجى التواصل معنا عبر:
- **البريد الإلكتروني:** admin@zyiarah.com

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    const app = initializeApp({
      apiKey: "AIzaSyCwyG5_yH1rKd-CBQGwQylw2n8jrPbn17o",
      authDomain: "zyiarah-app.firebaseapp.com",
      projectId: "zyiarah-app",
      storageBucket: "zyiarah-app.firebasestorage.app",
      messagingSenderId: "275681992607",
      appId: "1:275681992607:web:6dc4a0042fab5b69b127aa"
    });
    const db = getFirestore(app);
    const el = document.getElementById('content');
    const updatedEl = document.getElementById('updated');

    // `textContent` لا `innerHTML`: آمنٌ من XSS، و`pre-wrap` يَحفظُ الأسطر.
    function show(text) {
      el.classList.remove('state');
      el.textContent = text;
    }
    // الاحتياطيُّ نصُّ `privacy_policy.md` حرفيّاً — تُجرَّدُ علاماتُ
    // Markdown عند العرضِ وحدَه، فيَبقى المصدرُ مطابقاً للملفِّ بايتاً ببايت
    // (وعليه يَقومُ الحارس).
    function showFallback() {
      const raw = document.getElementById('fallback-policy').innerHTML;
      const txt = raw
        .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')
        .replace(/^#{1,6}\s*/gm, '')
        .replace(/\*\*(.+?)\*\*/g, '$1')
        .trim();
      show(txt);
    }

    try {
      const snap = await getDoc(doc(db, 'public_content', 'privacy'));
      const data = snap.exists() ? snap.data() : null;
      const content = (data && data.content ? String(data.content) : '').trim();
      if (content) {
        show(content);
        const ts = data.updated_at;
        if (ts && ts.toDate) {
          const d = ts.toDate();
          updatedEl.textContent = 'آخر تحديث: ' +
            new Intl.DateTimeFormat('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' }).format(d);
        }
      } else {
        showFallback();
      }
    } catch (e) {
      // لا رسالةَ عطلٍ مكانَ السياسة: الرابطُ يَجبُ أن يَخدمَ سياسةً دائماً.
      showFallback();
    }
  </script>
