<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>تمّ الدفع — زيارة</title>
  <!-- صفحةُ عَوْدةٍ لبوّابةِ تمارا (2026-10-05).
       `functions/index.js` يُسلّمُ تمارا `merchant_url.success` = هذا المسار،
       وهو يُفتَحُ فعلاً: الشاشاتُ الثلاثُ (`checkout_screen`،
       `store_payment_screen`) تَعترِضُه في `onPageStarted` — أي **بعدَ بدءِ
       التحميل** — ومسارُ النجاحِ يَنتظرُ قراءاتِ Firestore قبل أن يُغادر،
       فما كان يُعرَضُ في تلك النافذةِ صفحةُ 404 الإنجليزيّةَ من Firebase
       داخلَ شاشةٍ عنوانُها «إتمام الدفع - تمارا»، في اللحظةِ التي تَحتاجُ
       فيها العميلةُ طمأنينةً عن مالِها.

       فلا JavaScript ولا خطوطٌ ولا صورٌ ولا أيُّ طلبٍ خارجيّ: الصفحةُ تُرسَمُ
       من أوّلِ بايت. و`logo.png` ٢٤٧ كيلوبايت فلا مكانَ له هنا.

       ولا تَدّعي أنّ الطلبَ مؤكَّد: `is_paid` يَقلبُه الـwebhook
       (`_tamaraFlipPaid`) أو مكنسةُ `confirmPendingTamaraOrders`، وقد لا
       يَكونانِ قد عَمِلا بعد. ولا زرَّ «أعيدي الدفع» في أيٍّ من الصفحاتِ
       الثلاث — جلسةُ تمارا ثانيةٌ على طلبٍ مدفوعٍ خصمٌ مكرَّرٌ استردادُه يدويّ. -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: #f8fafc; color: #1e293b; line-height: 1.9;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px; text-align: center;
    }
    .card {
      background: #fff; border-radius: 24px; padding: 40px 28px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.06); max-width: 460px; width: 100%;
    }
    .mark {
      width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 22px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem; font-weight: 900; color: #fff; background: #16a34a;
    }
    h1 { font-size: 1.5rem; font-weight: 800; color: #166534; }
    p { margin-top: 12px; color: #334155; font-size: 1.02rem; }
    .hint { margin-top: 22px; background: #f1f5f9; border-radius: 16px; padding: 16px 18px; color: #64748b; font-size: 0.95rem; }
    .links { margin-top: 24px; font-size: 0.9rem; }
    .links a { color: #660033; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">✓</div>
    <h1>تمّ الدفع بنجاح</h1>
    <p>استلمَت تمارا دفعتكِ، ونُؤكّدُ طلبكِ الآن.</p>
    <div class="hint">
      يمكنكِ العودةُ إلى تطبيق «زيارة» ومتابعةُ الطلبِ من «طلباتي» — ويَصِلُكِ
      إشعارٌ بالتأكيد. لا تُعيدي الدفعَ حتى لو تأخّرَ التأكيدُ دقائق.
    </div>
    <div class="links">
      <a href="mailto:support@zyiarah.com">تواصلي معنا</a> ·
      <a href="/support">الدعم</a>
    </div>
  </div>
</body>
</html>
